<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LingQ 미니 스토리 연습장 v12 — 1a~20c · 26개 언어</title>
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --primary: #2563eb;
    --primary-light: #eff6ff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --stress: #dc2626;
    --tone: #059669;
    --star: #d97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding-bottom: 70px;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px 7px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner { max-width: 980px; margin: 0 auto; }
  .title-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  h1 { font-size: 1.02rem; font-weight: 800; color: var(--primary); }
  h1 .ver { font-size: 0.72rem; font-weight: 700; color: #fff; background: var(--primary); border-radius: 6px; padding: 1px 6px; margin-left: 4px; vertical-align: 2px; }
  .tabs { display: flex; gap: 5px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .tab-btn {
    flex: 0 0 auto;
    padding: 6px 10px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  main { max-width: 980px; margin: 14px auto; padding: 0 12px; }
  .storybar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 10px;
    margin-bottom: 10px;
  }
  .storybar .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .storybar label.key { font-size: 0.78rem; font-weight: 700; color: var(--muted); }
  #story-meta { font-size: 0.74rem; color: var(--muted); margin-top: 3px; display: block; line-height: 1.45; max-height: 2.9em; overflow: hidden; }
  .controls {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    margin-bottom: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    justify-content: space-between;
  }
  select, button {
    font-family: inherit;
    font-size: 0.85rem;
    padding: 6px 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }
  select { font-weight: 600; max-width: 100%; }
  #lang-select { min-width: 200px; max-width: 100%; }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
  .btn-stop { background: #fee2e2; color: #7f1d1d; border-color: #fecaca; font-weight: 700; }
  .btn-toggle.active { background: #fef3c7; border-color: #f59e0b; color: #92400e; font-weight: 600; }
  .speed { display: flex; gap: 4px; align-items: center; }
  .speed .lbl { font-size: 0.75rem; color: var(--muted); font-weight: 700; margin-right: 2px; }
  .speed button { padding: 5px 8px; font-size: 0.78rem; }
  .speed button.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 700; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 2px 8px rgba(15,23,42,0.04);
  }
  .card-top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 600;
  }
  .star-btn { padding: 4px 9px; font-size: 0.82rem; border-radius: 999px; }
  .star-btn.on { background: #fffbeb; border-color: var(--star); color: var(--star); font-weight: 700; }
  .label-chip {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 800;
    color: #92400e;
    background: #fef3c7;
    border-radius: 999px;
    padding: 2px 9px;
    margin-bottom: 6px;
  }
  .label-chip.q { color: #1e40af; background: #dbeafe; }
  .label-chip.a { color: #166534; background: #dcfce7; }
  .orig-text { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; word-break: keep-all; overflow-wrap: anywhere; }
  .trad-text { font-size: 0.95rem; color: #475569; margin: -4px 0 10px; }
  .box { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .box-label { font-size: 0.74rem; font-weight: 700; color: var(--muted); margin-bottom: 3px; }
  .pron-text, .nat-text, .ko-text { font-size: 0.98rem; }
  .hidden-blur { filter: blur(5px); cursor: pointer; user-select: none; }
  .tag-stress { color: var(--stress); font-weight: 700; font-size: 0.85em; }
  .tag-tone { color: var(--tone); font-weight: 700; font-size: 0.85em; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 0.9rem; }
  th, td { border-bottom: 1px solid var(--border); padding: 7px 6px; text-align: left; vertical-align: top; }
  th { font-size: 0.76rem; color: var(--muted); font-weight: 700; background: var(--bg); position: sticky; top: 0; }
  td:first-child { font-weight: 700; }
  .legend { margin-top: 10px; padding: 9px 11px; border-radius: 10px; background: #f0fdf4; border: 1px solid #bbf7d0; font-size: 0.76rem; color: #14532d; line-height: 1.55; }
  .legend b { color: #166534; }
  .pill-list { display: flex; flex-wrap: nowrap; gap: 5px; margin-bottom: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
  .pill-list::-webkit-scrollbar { display: none; }
  .pill { flex: 0 0 auto; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); background: #fff; font-size: 0.78rem; }
  .pill.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 700; }
  .pill.playing { background: #fde68a; border-color: #f59e0b; color: #78350f; font-weight: 800; }
  .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; }
  .quiz-opt {
    display: block; width: 100%; text-align: left;
    padding: 11px 13px; margin-top: 7px;
    border: 1px solid var(--border); border-radius: 10px; background: #fff; font-size: 0.94rem;
  }
  .quiz-opt.correct { background: #dcfce7; border-color: #16a34a; color: #14532d; font-weight: 700; }
  .quiz-opt.wrong { background: #fee2e2; border-color: #dc2626; color: #7f1d1d; }
  .quiz-audio { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 8px; }
  .q-blank { font-size: 1.35rem; font-weight: 700; margin-bottom: 8px; }
  .q-blank .blank { color: var(--primary); border-bottom: 3px solid var(--primary); padding: 0 14px; }
  .q-feedback { margin-top: 10px; font-weight: 700; font-size: 0.95rem; min-height: 1.4em; }
  .q-feedback.ok { color: #15803d; }
  .q-feedback.no { color: #b91c1c; }
  .q-score { font-size: 0.8rem; color: var(--muted); font-weight: 700; }
  .compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .star-item { border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 9px; background: #fff; }
  .star-item .meta { font-size: 0.76rem; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
  .star-item .o { font-size: 1.02rem; font-weight: 700; }
  .star-item .k { font-size: 0.88rem; color: #475569; margin-top: 2px; }
  .star-item .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .star-item .acts button { padding: 5px 10px; font-size: 0.8rem; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 18px; text-align: center; }
  .hidden { display: none !important; }
  .loading { padding: 30px; text-align: center; color: var(--muted); font-size: 0.95rem; }
  .errmark { color: #b91c1c; font-weight: 700; }
  .note { font-size: 0.78rem; color: var(--muted); margin-top: 8px; }
  .chip-line { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 10px; }
  .chip { font-size: 0.72rem; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: var(--primary-light); color: var(--primary); }
  .chip.warn { background: #fef2f2; color: #b91c1c; }
  @media (max-width: 520px) {
    .orig-text { font-size: 1.22rem; }
    .controls { padding: 10px; }
    h1 { font-size: 0.95rem; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="title-row">
      <h1>🌐 LingQ 미니 스토리 연습장 <span class="ver">v12</span></h1>
      <div class="tabs">
        <button class="tab-btn active" data-mode="card">카드 학습</button>
        <button class="tab-btn" data-mode="quiz">퀴즈</button>
        <button class="tab-btn" data-mode="compare">언어 비교</button>
        <button class="tab-btn" data-mode="stars">★ 복습함 <span id="star-count"></span></button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="storybar">
    <div class="row">
      <label class="key" for="story-select">회차</label>
      <select id="story-select" onchange="selectStory(this.value, true)"></select>
      <span class="chip" id="story-chip">불러오는 중…</span>
    </div>
    <span id="story-meta"></span>
  </div>

  <!-- 카드 학습 -->
  <section id="mode-card">
    <div class="controls">
      <select id="lang-select" onchange="selectLang(this.value)"></select>
      <div class="speed" id="speed-pills">
        <span class="lbl">배속</span>
        <button data-speed="0.7" onclick="setSpeed(0.7)">0.7x 느리게</button>
        <button data-speed="1" class="active" onclick="setSpeed(1)">1.0x 보통</button>
        <button data-speed="1.25" onclick="setSpeed(1.25)">1.25x</button>
        <button data-speed="1.5" onclick="setSpeed(1.5)">1.5x 빠르게</button>
      </div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button class="btn-primary" onclick="speakSentence()">🔊 듣기</button>
        <button id="btn-playall" onclick="togglePlayAll()">▶️ 전체 듣기</button>
        <button onclick="showVoiceDiag()">🩺 소리 진단</button>
      </div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button id="toggle-pron" class="btn-toggle" onclick="toggleHide('pron')">발음 가리기</button>
        <button id="toggle-ko" class="btn-toggle" onclick="toggleHide('ko')">해석 가리기</button>
        <button id="toggle-tbl" class="btn-toggle" onclick="toggleHide('tbl')">단어표 가리기</button>
      </div>
    </div>
    <div class="pill-list" id="sent-pills"></div>
    <div class="card" id="card-body"><div class="loading">회차 데이터를 불러오는 중…</div></div>
    <div class="nav-row">
      <button onclick="prevSent()">← 이전 문장</button>
      <span id="sent-counter" style="font-weight:700; color:var(--muted);"></span>
      <button onclick="nextSent()">다음 문장 →</button>
    </div>
  </section>

  <!-- 퀴즈 -->
  <section id="mode-quiz" class="hidden">
    <div class="controls">
      <select id="quiz-type" onchange="newQuiz()">
        <option value="meaning">4지선다 — 뜻 맞추기</option>
        <option value="cloze">소리 듣고 빈칸 채우기</option>
      </select>
      <select id="quiz-lang-select" onchange="newQuiz()"></select>
      <button class="btn-primary" onclick="newQuiz()">새 문제</button>
      <span class="q-score" id="quiz-score"></span>
    </div>
    <div class="card" id="quiz-body"><div class="empty">언어를 고르고 새 문제를 눌러 주세요.</div></div>
  </section>

  <!-- 언어 비교 -->
  <section id="mode-compare" class="hidden">
    <div class="controls">
      <select id="cmp-1" onchange="renderCompare()"></select>
      <select id="cmp-2" onchange="renderCompare()"></select>
      <select id="cmp-3" onchange="renderCompare()"></select>
    </div>
    <div class="pill-list" id="cmp-pills"></div>
    <div class="compare-grid" id="compare-grid"></div>
  </section>

  <!-- 별표 복습함 -->
  <section id="mode-stars" class="hidden">
    <div class="controls">
      <span style="font-size:0.86rem; color:var(--muted); font-weight:700;">★ 표시한 문장을 모아 둡니다 (이 기기에 저장)</span>
      <button onclick="exportStars()">내보내기</button>
      <button class="btn-stop" onclick="clearStars()">전체 비우기</button>
    </div>
    <div id="stars-body"></div>
  </section>
</main>

<script>
/* =========================================================
   LingQ 미니 스토리 연습장 v12
   - 회차(1a~20c) 드롭다운 + stories/{id}.json 동적 로딩
   - 배속 0.7/1.0/1.25/1.5 (카드·연속·비교·퀴즈 모두)
   - 전체 문장 연속 듣기 + 현재 문장 하이라이트
   - 언어 비교 카드마다 🔊 듣기
   - 퀴즈: 뜻 4지선다 / 소리 듣고 빈칸, 정답 시 자동 다음 문제
   - ★ 복습함(localStorage)
   - 중국어 간체·번체 병기 + 성조 범례
   ========================================================= */
var ORDINALS = ["첫째","둘째","셋째","넷째","다섯째","여섯째","일곱째","여덟째","아홉째","열째",
  "열한째","열두째","열셋째","열넷째","열다섯째","열여섯째","열일곱째","열여덟째","열아홉째","스무째",
  "스물한째","스물둘째","스물셋째","스물넷째","스물다섯째","스물여섯째","스물일곱째","스물여덟째","스물아홉째","서른째",
  "서른한째","서른두째","서른셋째","서른넷째","서른다섯째","서른여섯째","서른일곱째","서른여덟째","서른아홉째","마흔째"];

var MANIFEST = [];
var STORY = null;
var storyId = '';
var curLangCode = 'en';
var curSentIdx = 0;
var cmpSentIdx = 0;
var speed = 1;
var hideState = { pron: false, ko: false, tbl: false };
var STARS = {};
var LANGNAMES = {};
var seq = { active: false, idx: 0, token: 0, watch: null };
var quizState = { lang: '', type: 'clue', correct: null, sent: null, answered: false, attempts: 0, right: 0, total: 0, timer: null, clozeWord: null };

/* ---------- 저장소 ---------- */
function lsGet(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function loadPrefs() {
  speed = Number(lsGet('lq12_speed', 1)) || 1;
  hideState = lsGet('lq12_hide', hideState) || hideState;
  STARS = lsGet('lq12_stars', {}) || {};
  LANGNAMES = lsGet('lq12_names', {}) || {};
}
function savePrefs() { lsSet('lq12_speed', speed); lsSet('lq12_hide', hideState); }

/* ---------- 유틸 ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function formatTags(str) {
  return esc(str)
    .replace(/\[(강|장|강·장)\]/g, '<span class="tag-stress">[$1]</span>')
    .replace(/\[(높평|올림|낮꺾|내림|경성|높상|중평|낮내|낮상|낮평|평판|첫높|중높|끝높)\]/g, '<span class="tag-tone">[$1]</span>');
}
function makeNaturalPron(str) {
  var s = String(str);
  s = s.replace(/\s+어(?=\s|\[|<|$)/g, '어');
  s = s.replace(/\s+앤(?=\s|\[|<|$)/g, '앤');
  s = s.replace(/\s+투(?=\s|\[|<|$)/g, '투');
  s = s.replace(/\s+인(?=\s|\[|<|$)/g, '인');
  s = s.replace(/\s+앳(?=\s|\[|<|$)/g, '앳');
  s = s.replace(/\s+포(?=\s|\[|<|$)/g, '포');
  s = s.replace(/\s+프롬(?=\s|\[|<|$)/g, '프롬');
  s = s.replace(/\s+오브(?=\s|\[|<|$)/g, '오브');
  s = s.replace(/\s+어브(?=\s|\[|<|$)/g, '어브');
  s = s.replace(/\s+더(?=\s|\[|<|$)/g, '더');
  s = s.replace(/([가-힣]{1,2})\s+([가-힣]{1,2})(?=\s|\[|<|$)/g, '$1$2');
  s = s.replace(/([가-힣]{1,2})\s+([가-힣]{1,2})(?=\s|\[|<|$)/g, '$1$2');
  return s;
}
function byCode(code) {
  if (!STORY) return null;
  for (var i = 0; i < STORY.langs.length; i++) if (STORY.langs[i].code === code) return STORY.langs[i];
  return null;
}
function curLang() {
  var l = byCode(curLangCode);
  if (!l && STORY && STORY.langs.length) l = STORY.langs[0];
  return l;
}
function ordinal(i) { return ORDINALS[i] || (i + 1) + '번째'; }

/* ---------- 화면 모드 ---------- */
function setMode(mode, btn) {
  var btns = document.querySelectorAll('.tab-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-mode') === mode);
  var modes = ['card', 'quiz', 'compare', 'stars'];
  for (var m = 0; m < modes.length; m++) {
    document.getElementById('mode-' + modes[m]).classList.toggle('hidden', modes[m] !== mode);
  }
  stopAll();
  if (mode === 'quiz') newQuiz();
  if (mode === 'compare') renderCompare();
  if (mode === 'stars') renderStars();
}
function bindTabs() {
  var btns = document.querySelectorAll('.tab-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () { setMode(this.getAttribute('data-mode')); });
  }
}

/* ---------- 회차/언어 ---------- */
function buildStorySelect() {
  var html = '';
  var group = null;
  for (var i = 0; i < MANIFEST.length; i++) {
    var s = MANIFEST[i];
    if (s.num !== group) {
      if (group !== null) html += '</optgroup>';
      html += '<optgroup label="' + s.num + '편">';
      group = s.num;
    }
    html += '<option value="' + s.id + '">' + s.id + ' · ' + esc(s.title) + '</option>';
  }
  if (group !== null) html += '</optgroup>';
  document.getElementById('story-select').innerHTML = html;
}

function selectStory(id, keepLang, keepSent) {
  if (!id) return;
  stopAll();
  storyId = id;
  document.getElementById('story-select').value = id;
  document.getElementById('story-chip').textContent = '불러오는 중…';
  document.getElementById('story-meta').textContent = '';
  document.getElementById('card-body').innerHTML = '<div class="loading">stories/' + esc(id) + '.json 불러오는 중…</div>';
  lsSet('lq12_story', id);
  fetch('stories/' + id + '.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      STORY = data;
      for (var li = 0; li < data.langs.length; li++) LANGNAMES[data.langs[li].code] = data.langs[li].name;
      lsSet('lq12_names', LANGNAMES);
      var meta = MANIFEST.filter(function (m) { return m.id === id; })[0] || {};
      document.getElementById('story-chip').textContent = id + ' · ' + (meta.langs || data.langs.length) + '개 언어 · ' + (meta.words || 0).toLocaleString() + '단어';
      document.getElementById('story-meta').textContent = data.subtitle || '';
      var codes = data.langs.map(function (l) { return l.code; });
      var want = keepLang && codes.indexOf(curLangCode) !== -1 ? curLangCode : (codes.indexOf('en') !== -1 ? 'en' : codes[0]);
      curLangCode = want;
      initSelects();
      curSentIdx = 0;
      cmpSentIdx = 0;
      renderCard();
      if (document.getElementById('mode-compare') && !document.getElementById('mode-compare').classList.contains('hidden')) renderCompare();
      if (document.getElementById('mode-stars') && !document.getElementById('mode-stars').classList.contains('hidden')) renderStars();
    })

function togglePlayAll() {
  if (seq.active) { stopAll(); return; }

  seq.active = true;
  seq.idx = curSentIdx;
  seq.token++;
  document.getElementById('btn-playall').textContent = '⏹️ 중지';
  document.getElementById('btn-playall').classList.add('btn-stop');

}
function speakSeq(token) {
  if (!seq.active || token !== seq.token) return;
  var lang = curLang();
  var i = seq.idx;
  if (i >= lang.sents.length) { stopAll(); return; }
  curSentIdx = i;
  renderCard();
  var s = lang.sents[i];
  var advanced = false;
  var goNext = function () {
    if (advanced || !seq.active || token !== seq.token) return;
    advanced = true;
    if (seq.watch) { clearTimeout(seq.watch); seq.watch = null; }
    if (seq.idx < lang.sents.length - 1) { seq.idx++; speakSeq(token); }
    else { stopAll(); }
  };
  var ok = speakText(s.o, lang, speed, 'tts-voice-info', goNext);
  if (!ok) {
    setVoiceStatus('이 언어 음성이 없어 연속 듣기를 멈췄습니다', lang, 'tts-voice-info');
    stopAll();
    return;
  }
  // onend가 오지 않는 기기(음성 목록 0개·정책 차단)에서도 멈추지 않도록 안전장치
  var est = Math.max(6000, String(s.o).length * 140 / Math.max(0.5, speed));
  if (seq.watch) clearTimeout(seq.watch);
  seq.watch = setTimeout(goNext, est);
}
function stopAll() {
  seq.active = false;
  seq.token++;
  if (seq.watch) { clearTimeout(seq.watch); seq.watch = null; }
  if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }
  speakToken++;
  var b = document.getElementById('btn-playall');
  if (b) { b.textContent = '▶️ 전체 듣기'; b.classList.remove('btn-stop'); }
  var counter = document.getElementById('sent-counter');
  if (counter && STORY && curLang()) counter.textContent = ordinal(curSentIdx) + ' (' + (curSentIdx + 1) + ' / ' + curLang().sents.length + ')';

/* ---------- TTS ---------- */
var cachedVoices = [];
var lastVoiceError = '';
var speakTimer = null;
var speakToken = 0;
var MSG_NO_VOICE = '기기에 해당 언어 음성이 없음 (설정 > 손쉬운 사용 > 말하기 콘텐츠 > 음성에서 추가)';
var VOICE_GOOD_WORDS = ['enhanced', 'premium', 'siri', 'natural', 'neural', 'online', 'google'];
var VOICE_BAD_WORDS = ['compact', 'eloquence', 'espeak', 'pico'];
var VOICE_ROBOT_NAMES = ['sandy', 'shelley', 'eddy', 'flo', 'grandma', 'grandpa', 'reed', 'rocko',
  'albert', 'bad news', 'bahh', 'bells', 'boing', 'bubbles', 'cellos', 'good news', 'jester', 'organ',
  'superstar', 'trinoids', 'whisper', 'wobble', 'zarvox', 'fred', 'junior', 'ralph', 'kathy', 'karen'];
var UK_VOICE_NAMES = ['daniel', 'oliver', 'arthur', 'kate', 'serena', 'martha', 'stephanie', 'libby', 'sonia', 'ryan', 'maisie', 'google uk english'];
var LANG_ALIASES = { 'nb': ['no'], 'no': ['nb'] };

function voiceNameTokens(name) {
  return String(name || '').toLowerCase().replace(/[^a-z]+/g, ' ').trim().split(' ').filter(Boolean);
}
function isRobotVoiceName(name) {
  var tokens = voiceNameTokens(name);
  if (!tokens.length) return false;
  var joined = ' ' + tokens.join(' ') + ' ';
  for (var i = 0; i < VOICE_ROBOT_NAMES.length; i++) {
    var key = VOICE_ROBOT_NAMES[i];
    if (key.indexOf(' ') !== -1) { if (joined.indexOf(' ' + key + ' ') !== -1) return true; }
    else if (tokens.indexOf(key) !== -1) return true;
  }
  return false;
}
function voiceQualityScore(name) {
  var n = String(name || '').toLowerCase();
  var score = 0;
  if (isRobotVoiceName(n)) score -= 100;
  for (var i = 0; i < VOICE_GOOD_WORDS.length; i++) if (n.indexOf(VOICE_GOOD_WORDS[i]) !== -1) score += 10;
  for (var j = 0; j < VOICE_BAD_WORDS.length; j++) if (n.indexOf(VOICE_BAD_WORDS[j]) !== -1) score -= 30;
  return score;
}
function nameIsUk(name) {
  var n = String(name || '').toLowerCase();
  for (var i = 0; i < UK_VOICE_NAMES.length; i++) if (n.indexOf(UK_VOICE_NAMES[i]) !== -1) return true;
  return false;
}
function getAllVoices() {
  if (!('speechSynthesis' in window)) return [];
  var list = window.speechSynthesis.getVoices() || [];
  if (list.length) { cachedVoices = list; return list; }
  return cachedVoices || [];
}
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  var list = window.speechSynthesis.getVoices() || [];
  if (list.length) cachedVoices = list;
  refreshVoiceStatus();
  refreshQuizVoiceStatus();
}
function initVoices() {
  if (!('speechSynthesis' in window)) return;
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
  if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener('voiceschanged', loadVoices);
  setTimeout(loadVoices, 300);
  setTimeout(loadVoices, 1500);
}
function voiceStatusBase(lang) {
  if (!lang) return '';
  return 'TTS ' + lang.tts + (lang.ttsNote ? (' · ' + lang.ttsNote) : '');
}
function setVoiceStatus(msg, langObj, statusElId) {
  var statusEl = document.getElementById(statusElId || 'tts-voice-info');
  if (!statusEl) return;
  var lang = langObj || curLang();
  var note = (lang && lang.ttsNote) ? (' · ' + lang.ttsNote) : '';
  statusEl.textContent = msg + note;
}
function refreshVoiceStatus() {
  var lang = curLang();
  if (!lang) return;
  var statusEl = document.getElementById('tts-voice-info');
  if (!statusEl) return;
  var base = voiceStatusBase(lang);
  if (!('speechSynthesis' in window)) { statusEl.textContent = base; return; }
  var info = getVoiceMatchInfo(lang.tts);
  if (info.totalVoices === 0) { statusEl.textContent = base; return; }
  if (info.voice) {
    statusEl.textContent = base;
    statusEl.setAttribute('title', '선택 음성: ' + info.voice.name + ' [' + info.voice.lang + ']');
  } else {
    statusEl.textContent = MSG_NO_VOICE + (lang.ttsNote ? (' · ' + lang.ttsNote) : '');
  }
}
function refreshQuizVoiceStatus() {
  var statusEl = document.getElementById('quiz-tts-voice-info');
  if (!statusEl) return;
  var sel = document.getElementById('quiz-lang-select');
  var lang = byCode(sel ? sel.value : quizState.lang);
  if (!lang) return;
  var base = voiceStatusBase(lang);
  if (!('speechSynthesis' in window)) { statusEl.textContent = base; return; }
  var info = getVoiceMatchInfo(lang.tts);
  if (info.totalVoices === 0) { statusEl.textContent = base; return; }
  if (info.voice) { statusEl.textContent = base; statusEl.setAttribute('title', '선택 음성: ' + info.voice.name + ' [' + info.voice.lang + ']'); }
  else { statusEl.textContent = MSG_NO_VOICE + (lang.ttsNote ? (' · ' + lang.ttsNote) : ''); }
}
function getVoiceMatchInfo(langCode) {
  var empty = { voice: null, matched: false, totalVoices: 0, sameLangList: [] };
  if (!('speechSynthesis' in window)) return empty;
  var voices = getAllVoices();
  if (!voices.length) return empty;
  var target = String(langCode || '').toLowerCase().replace(/_/g, '-');
  var prefix = target.split('-')[0];
  var aliasPrefixes = LANG_ALIASES[prefix] || [];
  var best = null, bestScore = -100000, sameLangList = [];
  for (var i = 0; i < voices.length; i++) {
    var v = voices[i];
    var vLang = String(v.lang || '').toLowerCase().replace(/_/g, '-');
    var vPrefix = vLang.split('-')[0];
    var vName = String(v.name || '').toLowerCase();
    var langScore = 0;
    if (vLang === target) langScore = 100;
    else if (target === 'en-gb' && vPrefix === 'en' && nameIsUk(vName)) langScore = 95;
    else if (vPrefix === prefix || aliasPrefixes.indexOf(vPrefix) !== -1) langScore = 40;
    if (!langScore) continue;
    sameLangList.push(v);
    var score = langScore + voiceQualityScore(vName);
    if (score > bestScore) { bestScore = score; best = v; }
  }
  return { voice: best, matched: Boolean(best), totalVoices: voices.length, sameLangList: sameLangList };
}
function buildNaturalSpeechText(text, code) {
  var t = String(text || '').trim();
  t = t.replace(/^\([^)]*\)\s*/, '');
  if (code === 'sco' || code === 'shet' || code === 'ork') {
    t = t.replace(/\bA\b/g, 'I').replace(/\bme\b/g, 'my').replace(/\btae\b/g, 'to')
         .replace(/\bwark\b/g, 'work').replace(/\bcaur\b/g, 'car').replace(/\bfae\b/g, 'from');
  }
  return t;
}
function baseSpeechRate(lang) {
  var baseRate = 0.93;
  if (!lang) return baseRate;
  if (lang.code === 'zh' || lang.code === 'yue' || lang.code === 'ja') baseRate = 0.9;
  if (lang.code === 'es' || lang.code === 'it' || lang.code === 'pt' || lang.code === 'fr') baseRate = 0.95;
  return baseRate;
}
function speakText(text, lang, rate, statusElId, onEnd) {
  if (!('speechSynthesis' in window)) {
    alert('현재 뷰어에서는 음성 합성을 지원하지 않습니다. PC 브라우저나 모바일 웹 브라우저(Chrome·Safari 등)에서 열어주세요.');
    return false;
  }
  if (!lang) return false;
  var statusId = statusElId || 'tts-voice-info';
  var synth = window.speechSynthesis;
  lastVoiceError = '';
  if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }
  var myToken = ++speakToken;
  var info = getVoiceMatchInfo(lang.tts);
  var rawText = buildNaturalSpeechText(text, lang.code);
  if (info.totalVoices > 0 && !info.voice) {
    setVoiceStatus(MSG_NO_VOICE, lang, statusId);
    return false;
  }
  var mult = (typeof rate === 'number' && rate > 0) ? rate : 1;
  var useRate = Math.min(2.0, Math.max(0.4, baseSpeechRate(lang) * mult));

  function fire() {
    if (myToken !== speakToken) return;
    if (!('speechSynthesis' in window)) return;
    if (info.totalVoices === 0) {
      var lateInfo = getVoiceMatchInfo(lang.tts);
      if (lateInfo.totalVoices > 0) info = lateInfo;
      if (info.totalVoices > 0 && !info.voice) { setVoiceStatus(MSG_NO_VOICE, lang, statusId); return; }
    }
    var u = new SpeechSynthesisUtterance(rawText);
    u.lang = lang.tts;
    if (info.voice) u.voice = info.voice;
    u.rate = useRate;
    u.pitch = 1.0;
    u.onerror = function (ev) {
      var err = ev && ev.error ? String(ev.error) : '재생 오류';
      if (err === 'canceled' || err === 'interrupted') return;
      lastVoiceError = err;
      setVoiceStatus('TTS 오류(' + err + ')', lang, statusId);
    };
    if (onEnd) {
      u.onend = function () { if (myToken === speakToken) onEnd(); };
    }
    if (info.totalVoices === 0) setVoiceStatus('목소리 목록 0개 — 기본 음성으로 시도', lang, statusId);
    else setVoiceStatus('음성: ' + info.voice.name + ' [' + info.voice.lang + '] (전체 ' + info.totalVoices + '개)', lang, statusId);
    synth.speak(u);
  }

  if (synth.speaking || synth.pending) {
    synth.cancel();
    if (synth.paused) synth.resume();
    speakTimer = setTimeout(function () { speakTimer = null; fire(); }, 80);
  } else {
    fire();
  }

}
function speakSentence() {
  var lang = curLang();
  if (!lang) return;
  var s = lang.sents[Math.min(curSentIdx, lang.sents.length - 1)];
  speakText(s.o, lang, speed, 'tts-voice-info');
}
function showVoiceDiag() {
  var lang = curLang();

  var info = getVoiceMatchInfo(lang.tts);
  var sameSummary = info.sameLangList.slice(0, 5).map(function (v) { return v.name + ' (' + v.lang + ')'; }).join(', ') || '없음';
  var allSample = voices.slice(0, 8).map(function (v) { return v.name + ' [' + v.lang + ']'; }).join(' / ') || '목록 비어 있음';
  alert('[음성 엔진 진단]\n- 회차: ' + storyId + '\n- 현재 언어: ' + lang.name + ' (' + lang.tts + ')\n' +
    '- speechSynthesis 지원: ' + (('speechSynthesis' in window) ? '예' : '아니오') + '\n' +
    '- 기기 전체 목소리: ' + voices.length + '개\n' +
    '- 선택된 목소리: ' + (info.voice ? (info.voice.name + ' [' + info.voice.lang + ']') : '없음(이 언어 음성 미설치 — 재생하지 않음)') + '\n' +
    '- 일치 언어군: ' + sameSummary + '\n- 기기 목소리 샘플: ' + allSample + '\n' +
    (lastVoiceError ? ('- 최근 오류: ' + lastVoiceError + '\n') : '') +

}

function quizLang() {

function rnd(n) { return Math.floor(Math.random() * n); }
function cleanWord(w) {
  return String(w || '').replace(/^[.,!?;:。"'“”‘’()\[\]…·、，？！；：「」『』（）\-]+/, '')
    .replace(/[.,!?;:。"'“”‘’()\[\]…·、，？！；：「」『』（）\-]+$/, '').trim();
}
function isNumberWord(w) { return /^[0-9０-９一二三四五六七八九十百千]+$/.test(cleanWord(w)); }
function badBlankRow(row) {
  var wd = String(row[0] || ''), mn = String(row[2] || '');
  if (/[:：]$/.test(wd)) return true;
  if (mn.indexOf('번호') !== -1) return true;
  if (isNumberWord(wd)) return true;
  if (/^(one|two|three|four|five|six|seven|eight|nine|ten|first|second|third|fourth|fifth|sixth|seventh|eighth)$/i.test(cleanWord(wd))) return true;
  return false;
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function quizType() {
  var el = document.getElementById('quiz-type');
  return el ? el.value : 'meaning';
}
function newQuiz() {
  if (!STORY) return;
  if (quizState.timer) { clearTimeout(quizState.timer); quizState.timer = null; }
  var lang = quizLang();
  if (!lang || !lang.sents.length) return;
  var type = quizType();
  quizState.lang = lang.code;
  quizState.type = type;
  quizState.answered = false;
  quizState.attempts = 0;
  var body = document.getElementById('quiz-body');

  var qi = rnd(lang.sents.length);
  if (type === 'cloze') {
    // 빈칸으로 쓸 수 있는 낱말 찾기 (문장 안에 그대로 등장하는 것)
    var tries = 0, picked = null, sent = null, core2 = '';
    while (tries++ < 80 && !picked) {
      var cand = lang.sents[rnd(lang.sents.length)];
      var idxs = [];
      for (var i = 0; i < cand.w.length; i++) {
        var core = cleanWord(cand.w[i][0]);
        if (core.length >= 2 && !badBlankRow(cand.w[i]) && cand.o.indexOf(core) !== -1) idxs.push({ i: i, n: core.length });
      }
      if (idxs.length) {
        // 핵심 낱말 위주로 — 긴 낱말 절반 안에서 고른다
        idxs.sort(function (a, b) { return b.n - a.n; });
        var keep = idxs.slice(0, Math.max(1, Math.ceil(idxs.length / 2)));
        picked = cand.w[keep[rnd(keep.length)].i]; sent = cand;
      }
    }
    if (!picked) { body.innerHTML = '<div class="empty">이 언어에서는 빈칸 문제를 만들 수 없습니다. 다른 언어를 골라 주세요.</div>'; return; }
    core2 = cleanWord(picked[0]);
    quizState.correct = core2;
    quizState.sent = sent;
    quizState.clozeWord = picked;
    var shown = sent.o.replace(core2, '____');
    // 보기: 정답 + 같은 언어의 다른 낱말 3개 (문장부호·번호 낱말은 뺀다)
    var pool = [], seen = {};
    seen[core2.toLowerCase()] = 1;
    for (var s2 = 0; s2 < lang.sents.length && pool.length < 60; s2++) {
      var ss = lang.sents[s2];
      for (var k = 0; k < ss.w.length; k++) {
        var ww = cleanWord(ss.w[k][0]);
        if (ww.length < 2 || badBlankRow(ss.w[k])) continue;
        if (seen[ww.toLowerCase()]) continue;
        seen[ww.toLowerCase()] = 1;
        pool.push(ww);
      }
    }
    var opts = [{ t: core2, ok: true }];
    var guard = 0;
    while (opts.length < 4 && guard++ < 200 && pool.length) opts.push({ t: pool.splice(rnd(pool.length), 1)[0], ok: false });
    opts = shuffle(opts);
    var optsHtml = '';
    for (var j = 0; j < opts.length; j++) {
      optsHtml += '<button class="quiz-opt" onclick="checkQuiz(this, ' + (opts[j].ok ? 'true' : 'false') + ')">' + esc(opts[j].t) + '</button>';
    }
    body.innerHTML =
      '<div class="card-top"><span>' + esc(STORY.id) + ' · ' + esc(lang.name) + ' 빈칸 듣기</span>' +
      '<span><span id="quiz-tts-voice-info">' + esc(voiceStatusBase(lang)) + '</span></span></div>' +
      '<div class="card-top" style="margin-bottom:6px;"><span>소리를 듣고 빈칸에 들어갈 낱말을 고르세요</span></div>' +
      '<div class="q-blank">' + esc(shown).replace('____', '<span class="blank">____</span>') + '</div>' +
      '<div class="quiz-audio">' +
        '<button class="btn-primary" onclick="quizSpeak()">🔊 다시 듣기</button>' +
        '<button onclick="quizSpeak(0.7)">🐢 느리게</button>' +
      '</div>' + optsHtml +
      '<div class="q-feedback" id="q-feedback"></div>';
  } else {
    var correct = lang.sents[qi];
    var pool2 = [];
    for (var m = 0; m < lang.sents.length; m++) if (m !== qi) pool2.push(lang.sents[m]);
    shuffle(pool2);
    var options = shuffle([correct, pool2[0], pool2[1], pool2[2]]);
    var html = '';
    for (var n = 0; n < options.length; n++) {
      if (!options[n]) continue;
      html += '<button class="quiz-opt" onclick="checkQuiz(this, ' + (options[n] === correct ? 'true' : 'false') + ')">' + esc(options[n].k) + '</button>';
    }
    quizState.correct = correct.k;
    quizState.sent = correct;
    body.innerHTML =
      '<div class="card-top"><span>' + esc(STORY.id) + ' · ' + esc(lang.name) + ' 뜻 맞추기</span>' +
      '<span>' + ordinal(qi) + ' 문장 · <span id="quiz-tts-voice-info">' + esc(voiceStatusBase(lang)) + '</span></span></div>' +
      (correct.lb ? '<span class="label-chip ' + (correct.lb === '질문' ? 'q' : 'a') + '">' + esc(correct.lb) + '</span>' : '') +
      '<div class="orig-text">' + esc(correct.o) + '</div>' +
      (correct.p ? '<div style="color:var(--muted); margin-bottom:10px;">발음: ' + formatTags(correct.p) + '</div>' : '') +
      '<div class="quiz-audio">' +
        '<button class="btn-primary" onclick="quizSpeak()">🔊 다시 듣기</button>' +
        '<button onclick="quizSpeak(0.7)">🐢 느리게</button>' +
      '</div>' + html +
      '<div class="q-feedback" id="q-feedback"></div>';
  }
  updateQuizScore();
  quizSpeak();
  refreshQuizVoiceStatus();
}
function quizSpeak(mult) {
  var lang = quizLang();
  if (!lang || !quizState.sent) return;
  speakText(quizState.sent.o, lang, speed * (mult === 0.7 ? 0.7 : 1), 'quiz-tts-voice-info');
}
function checkQuiz(btn, isCorrect) {
  if (quizState.answered) return;
  var opts = document.querySelectorAll('#quiz-body .quiz-opt');
  var fb = document.getElementById('q-feedback');

  if (isCorrect) {
    // 정답: 모든 보기 잠그고 정답 표시 → 잠시 뒤 다음 문제
    quizState.answered = true;
    for (var i = 0; i < opts.length; i++) {
      opts[i].disabled = true;
      var oc = opts[i].getAttribute('onclick') || '';
      if (opts[i] !== btn && oc.indexOf('true') !== -1) opts[i].classList.add('correct');
    }
    btn.classList.add('correct');
    quizState.total++;
    if (quizState.attempts === 0) quizState.right++;
    if (fb) {
      fb.className = 'q-feedback ok';
      fb.textContent = '정답입니다! ' + (quizState.type === 'cloze' && quizState.clozeWord ? ('‘' + quizState.correct + '’ — ' + quizState.clozeWord[2]) : '');
    }
    updateQuizScore();
    quizState.timer = setTimeout(function () {
      quizState.timer = null;
      if (document.getElementById('mode-quiz').classList.contains('hidden')) return;
      newQuiz();
    }, 900);
    return;
  }

  // 오답: 첫 번째는 다시 고를 수 있게, 두 번째 오답에서 정답 공개 후 넘어간다 (v11에서 엔젤 님이 만든 방식 유지)
  quizState.attempts++;
  btn.classList.add('wrong');
  btn.disabled = true;
  if (quizState.attempts === 1) {
    if (fb) { fb.className = 'q-feedback'; fb.textContent = '다시 한 번 골라 보세요.'; }
    return;
  }
  quizState.answered = true;
  for (var j = 0; j < opts.length; j++) {
    opts[j].disabled = true;
    var oc2 = opts[j].getAttribute('onclick') || '';
    if (oc2.indexOf('true') !== -1) opts[j].classList.add('correct');
  }
  quizState.total++;
  if (fb) {
    fb.className = 'q-feedback no';
    fb.textContent = '아쉬워요. 정답: ' + quizState.correct + (quizState.type === 'cloze' && quizState.clozeWord ? (' (' + quizState.clozeWord[2] + ')') : '');
  }
  updateQuizScore();
  quizState.timer = setTimeout(function () {
    quizState.timer = null;
    if (document.getElementById('mode-quiz').classList.contains('hidden')) return;
    newQuiz();
  }, 1500);
}
function updateQuizScore() {
  document.getElementById('quiz-score').textContent = quizState.total ? ('정답 ' + quizState.right + ' / ' + quizState.total) : '';
}

/* ---------- 언어 비교 ---------- */
function setCmpSent(i) { cmpSentIdx = i; renderCompare(); }
function renderCompare() {
  if (!STORY) return;
  var selIds = ['cmp-1', 'cmp-2', 'cmp-3'];
  var langs = [];
  for (var j = 0; j < 3; j++) {
    var el = document.getElementById(selIds[j]);
    var l = byCode(el.value) || STORY.langs[0];
    langs.push(l);
  }
  var maxLen = 0;
  for (var m = 0; m < langs.length; m++) maxLen = Math.max(maxLen, langs[m].sents.length);
  if (cmpSentIdx >= maxLen) cmpSentIdx = 0;
  var pills = '';
  for (var i = 0; i < maxLen; i++) {
    pills += '<button class="pill ' + (i === cmpSentIdx ? 'active' : '') + '" onclick="setCmpSent(' + i + ')">' + ordinal(i) + '</button>';
  }
  document.getElementById('cmp-pills').innerHTML = pills;

  var grid = '';
  for (var n = 0; n < langs.length; n++) {
    var lang = langs[n];
    var s = lang.sents[Math.min(cmpSentIdx, lang.sents.length - 1)];
    var isKo = lang.code === 'ko';
    var isZh = lang.code === 'zh';
    grid +=
      '<div class="card">' +
        '<div class="card-top"><span>' + esc(lang.name) + '</span><span>' + esc(lang.native) + '</span></div>' +
        (s.lb ? '<span class="label-chip ' + (s.lb === '질문' ? 'q' : 'a') + '">' + esc(s.lb) + '</span>' : '') +
        '<div style="font-size:1.1rem; font-weight:700; margin-bottom:6px; overflow-wrap:anywhere;">' + esc(s.o) + '</div>' +
        (isZh && s.o2 ? '<div class="trad-text">번체: ' + esc(s.o2) + '</div>' : '') +
        '<div class="quiz-audio"><button class="btn-primary" onclick="speakCompare(' + n + ')">🔊 듣기</button></div>' +
        (isKo ? '' : '<div class="box"><div class="box-label">발음</div><div>' + formatTags(s.p) + '</div></div>') +
        (isKo ? '' : '<div class="box"><div class="box-label">해석</div><div>' + esc(s.k) + '</div></div>') +
      '</div>';
  }
  document.getElementById('compare-grid').innerHTML = grid;
}
function speakCompare(n) {
  var el = document.getElementById('cmp-' + (n + 1));
  var lang = byCode(el.value);
  if (!lang) return;
  var s = lang.sents[Math.min(cmpSentIdx, lang.sents.length - 1)];
  speakText(s.o, lang, speed, null);
}

/* ---------- ★ 복습함 ---------- */
function renderStars() {
  var body = document.getElementById('stars-body');
  var keys = [];
  for (var k in STARS) if (STARS.hasOwnProperty(k) && STARS[k].length) keys.push(k);
  if (!keys.length) {
    body.innerHTML = '<div class="card"><div class="empty">아직 ★ 표시한 문장이 없습니다.<br>카드 학습에서 ☆ 별표를 눌러 모아 두세요.</div></div>';
    return;
  }
  var html = '';
  var pending = keys.length;
  // 현재 STORY 데이터로 바로 보여 줄 수 있는 것 먼저, 나머지는 manifest 정보만
  keys.forEach(function (key) {
    var parts = key.split('|');
    var sid = parts[0], code = parts[1];
    var meta = MANIFEST.filter(function (m) { return m.id === sid; })[0] || { title: sid };
    var idxs = STARS[key].slice().sort(function (a, b) { return a - b; });
    var head = '<div class="star-item" data-key="' + esc(key) + '"><div class="meta">' + esc(sid) + ' · ' + esc(meta.title) + ' · ' + esc(LANGNAMES[code] || code) + ' · ' + idxs.length + '문장</div>';
    html += head + '<div class="star-lines" id="star-lines-' + esc(key).replace(/[^A-Za-z0-9]/g, '_') + '"><div class="empty" style="padding:8px;">불러오는 중…</div></div></div>';
  });
  body.innerHTML = html;
  keys.forEach(function (key) {
    var parts = key.split('|');
    var sid = parts[0], code = parts[1];
    var box = document.getElementById('star-lines-' + key.replace(/[^A-Za-z0-9]/g, '_'));
    if (!box) return;
    if (STORY && STORY.id === sid) { paintStars(box, sid, code); return; }
    fetch('stories/' + sid + '.json', { cache: 'force-cache' })
      .then(function (r) { return r.json(); })
      .then(function (data) { paintStarsFrom(data, box, sid, code); })
      .catch(function () { box.innerHTML = '<div class="empty">불러오기 실패</div>'; });
  });
}
function paintStars(box, sid, code) { paintStarsFrom(STORY, box, sid, code); }
function paintStarsFrom(data, box, sid, code) {
  var lang = null;
  for (var i = 0; i < data.langs.length; i++) if (data.langs[i].code === code) lang = data.langs[i];
  if (!lang) { box.innerHTML = '<div class="empty">이 회차에 해당 언어가 없습니다.</div>'; return; }
  var idxs = (STARS[sid + '|' + code] || []).slice().sort(function (a, b) { return a - b; });
  var html = '';
  idxs.forEach(function (i) {
    var s = lang.sents[i];
    if (!s) return;
    html += '<div style="border-top:1px dashed var(--border); padding:8px 0;">' +
      '<div class="o">' + (s.lb ? '<span class="label-chip ' + (s.lb === '질문' ? 'q' : 'a') + '">' + esc(s.lb) + '</span> ' : '') + esc(s.o) + '</div>' +
      (lang.code === 'ko' ? '' : '<div class="k">' + esc(s.k) + '</div>') +
      '<div class="acts">' +
        '<button onclick="openStar(\'' + esc(sid) + '\',\'' + esc(code) + '\',' + i + ')">카드로 열기</button>' +
        '<button onclick="speakStar(\'' + esc(sid) + '\',\'' + esc(code) + '\',' + i + ')">🔊 듣기</button>' +
        '<button onclick="removeStar(\'' + esc(sid) + '\',\'' + esc(code) + '\',' + i + ')">★ 해제</button>' +
      '</div></div>';
  });
  box.innerHTML = html || '<div class="empty">문장이 없습니다.</div>';
}
var starCache = {};
function speakStar(sid, code, i) {
  function go(data) {
    var lang = null;
    for (var k = 0; k < data.langs.length; k++) if (data.langs[k].code === code) lang = data.langs[k];
    if (!lang || !lang.sents[i]) return;
    speakText(lang.sents[i].o, lang, speed, null);
  }
  if (starCache[sid]) { go(starCache[sid]); return; }
  fetch('stories/' + sid + '.json').then(function (r) { return r.json(); }).then(function (d) { starCache[sid] = d; go(d); });
}
function openStar(sid, code, i) {
  setMode('card');
  if (sid === storyId) { curLangCode = code; curSentIdx = i; initSelects(); renderCard(); return; }
  selectStory(sid);
  var tries = 0;
  var t = setInterval(function () {
    tries++;
    if (STORY && STORY.id === sid) {
      clearInterval(t);
      if (byCode(code)) curLangCode = code;
      curSentIdx = i;
      initSelects();
      renderCard();
    } else if (tries > 40) clearInterval(t);
  }, 100);
}
function removeStar(sid, code, i) {
  var key = sid + '|' + code;
  if (!STARS[key]) return;
  var at = STARS[key].indexOf(i);
  if (at !== -1) STARS[key].splice(at, 1);
  lsSet('lq12_stars', STARS);
  updateStarCount();
  renderStars();
  if (STORY && STORY.id === sid && code === curLangCode) renderCard();
}
function exportStars() {
  var lines = [];
  for (var key in STARS) {
    if (!STARS.hasOwnProperty(key) || !STARS[key].length) continue;
    var p = key.split('|');
    lines.push('# ' + p[0] + ' / ' + p[1] + ' : ' + STARS[key].sort(function (a, b) { return a - b; }).map(function (i) { return i + 1; }).join(', '));
  }
  var text = lines.join('\n') || '(비어 있음)';
  try {
    navigator.clipboard.writeText(text);
    alert('클립보드에 복사했습니다.\n\n' + text);
  } catch (e) { alert(text); }
}
function clearStars() {
  if (!confirm('★ 표시를 모두 지울까요?')) return;
  STARS = {};
  lsSet('lq12_stars', STARS);
  updateStarCount();
  renderStars();
  if (STORY) renderCard();
}

/* ---------- 시작 ---------- */
function applyPrefsToUI() {
  var btns = document.querySelectorAll('#speed-pills button');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', Number(btns[i].getAttribute('data-speed')) === speed);
  ['pron', 'ko', 'tbl'].forEach(function (k) {
    var b = document.getElementById('toggle-' + k);
    if (b) b.classList.toggle('active', !!hideState[k]);
  });
}
function boot() {
  loadPrefs();
  applyPrefsToUI();
  bindTabs();
  updateStarCount();
  fetch('stories/manifest.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      MANIFEST = data.stories || [];
      buildStorySelect();
      var hash = (location.hash || '').replace('#', '').split('/');
      var want = hash[0] || lsGet('lq12_story', '') || '1b';
      if (!MANIFEST.some(function (m) { return m.id === want; })) want = '1b';
      if (hash[1]) curLangCode = hash[1];
      selectStory(want, true);
    })
    .catch(function (err) {
      document.getElementById('card-body').innerHTML = '<div class="loading"><span class="errmark">stories/manifest.json 을 불러오지 못했습니다.</span><br>' +
        esc(err.message) + '<br><br>https://aenngel.github.io/LingQ-practice/ 주소로 열어 주세요.<br>(파일을 직접 열면 회차 데이터를 읽을 수 없습니다.)</div>';
    });
  initVoices();
}
window.addEventListener('hashchange', function () {
  var h = (location.hash || '').replace('#', '').split('/');
  if (h[0] && h[0] !== storyId && MANIFEST.some(function (m) { return m.id === h[0]; })) selectStory(h[0], true);
});
boot();
</script>
