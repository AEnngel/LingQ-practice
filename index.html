<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LingQ 미니 스토리 1b — 30개 언어 연습장</title>
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --primary: #2563eb;
    --primary-light: #eff6ff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --stress: #dc2626;
    --tone: #059669;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding-bottom: 60px;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
  }
  h1 { font-size: 1.15rem; font-weight: 800; color: var(--primary); }
  .tabs { display: flex; gap: 6px; }
  .tab-btn {
    padding: 8px 14px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  main { max-width: 960px; margin: 20px auto; padding: 0 16px; }
  .controls {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
  }
  select, button {
    font-family: inherit;
    font-size: 0.92rem;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
  }
  select { font-weight: 600; min-width: 210px; }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
  .btn-toggle.active { background: #fef3c7; border-color: #f59e0b; color: #92400e; font-weight: 600; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 2px 8px rgba(15,23,42,0.04);
  }
  .card-top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    row-gap: 2px;
    margin-bottom: 14px;
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 600;
  }
  .orig-text {
    font-size: 1.45rem;
    font-weight: 700;
    margin-bottom: 14px;
    word-break: keep-all;
  }
  .box {
    background: var(--bg);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .box-label {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .pron-text { font-size: 1.05rem; font-weight: 600; }
  .nat-text { font-size: 1.05rem; font-weight: 600; color: #0f766e; }
  .ko-text { font-size: 1.02rem; color: #1e293b; }
  .hidden-blur { filter: blur(6px); user-select: none; cursor: pointer; }
  .tag-stress { color: var(--stress); font-size: 0.8em; font-weight: 800; }
  .tag-tone { color: var(--tone); font-size: 0.8em; font-weight: 800; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 14px;
    font-size: 0.92rem;
  }
  th, td {
    border-bottom: 1px solid var(--border);
    padding: 9px 10px;
    text-align: left;
  }
  th { background: var(--bg); color: var(--muted); font-weight: 700; }
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    gap: 10px;
  }
  .pill-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .pill {
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 0.82rem;
  }
  .pill.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 700; }
  .quiz-opt {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    margin-top: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    font-size: 0.96rem;
  }
  .quiz-opt.correct { background: #dcfce7; border-color: #16a34a; color: #14532d; font-weight: 700; }
  .quiz-opt.wrong { background: #fee2e2; border-color: #dc2626; color: #7f1d1d; }
  .quiz-audio { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
  .compare-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>LingQ 미니 스토리 1b — 30개 언어 연습장</h1>
    <div class="tabs">
      <button class="tab-btn active" onclick="setMode('card', this)">카드 학습</button>
      <button class="tab-btn" onclick="setMode('quiz', this)">퀴즈 연습</button>
      <button class="tab-btn" onclick="setMode('compare', this)">언어 비교</button>
    </div>
  </div>
</header>

<main>
  <!-- 카드 학습 -->
  <section id="mode-card">
    <div class="controls">
      <select id="lang-select" onchange="selectLang(this.value)"></select>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button class="btn-primary" onclick="speakSentence(1.0)">🔊 듣기</button>
        <button onclick="speakSentence(0.7)">🐢 느리게</button>
        <button onclick="showVoiceDiag()">🩺 소리 진단</button>
        <button id="toggle-pron" class="btn-toggle" onclick="toggleHide('pron')">발음 가리기</button>
        <button id="toggle-ko" class="btn-toggle" onclick="toggleHide('ko')">해석 가리기</button>
        <button id="toggle-tbl" class="btn-toggle" onclick="toggleHide('tbl')">단어표 가리기</button>
      </div>
    </div>

    <div class="pill-list" id="sent-pills"></div>

    <div class="card" id="card-body"></div>

    <div class="nav-row">
      <button onclick="prevSent()">← 이전 문장</button>
      <span id="sent-counter" style="font-weight:700; color:var(--muted);"></span>
      <button onclick="nextSent()">다음 문장 →</button>
    </div>
  </section>

  <!-- 퀴즈 모드 -->
  <section id="mode-quiz" class="hidden">
    <div class="controls">
      <select id="quiz-lang-select" onchange="newQuiz()"></select>
      <button class="btn-primary" onclick="newQuiz()">새 문제 내기</button>
    </div>
    <div class="card" id="quiz-body"></div>
  </section>

  <!-- 비교 모드 -->
  <section id="mode-compare" class="hidden">
    <div class="controls">
      <select id="cmp-1" onchange="renderCompare()"></select>
      <select id="cmp-2" onchange="renderCompare()"></select>
      <select id="cmp-3" onchange="renderCompare()"></select>
    </div>
    <div class="pill-list" id="cmp-pills"></div>
    <div class="compare-grid" id="compare-grid"></div>
  </section>
</main>

function makeNaturalPron(str) {
  var s = String(str);
  // 불필요한 기계적 띄어쓰기를 줄여 실제 구어/연음 호흡에 가깝게 다듬음
  s = s.replace(/\s+어(?=\s|\[|<|$)/g, '어');
  s = s.replace(/\s+앤(?=\s|\[|<|$)/g, '앤');
  s = s.replace(/\s+투(?=\s|\[|<|$)/g, '투');
  s = s.replace(/\s+인(?=\s|\[|<|$)/g, '인');
  s = s.replace(/\s+앳(?=\s|\[|<|$)/g, '앳');
  s = s.replace(/\s+포(?=\s|\[|<|$)/g, '포');
  s = s.replace(/\s+프롬(?=\s|\[|<|$)/g, '프롬');
  s = s.replace(/\s+오브(?=\s|\[|<|$)/g, '오브');
  s = s.replace(/\s+어브(?=\s|\[|<|$)/g, '어브');
  s = s.replace(/\s+더(?=\s|\[|<|$)/g, '더');
  // 연속된 짧은 음절 사이 공백을 줄여 자연스러운 연음 흐름 형성
  s = s.replace(/([가-힣]{1,2})\s+([가-힣]{1,2})(?=\s|\[|<|$)/g, '$1$2');
  s = s.replace(/([가-힣]{1,2})\s+([가-힣]{1,2})(?=\s|\[|<|$)/g, '$1$2');
  return s;
}

function formatTags(str) {
  return String(str)

}

/*  v10 대비 변경
 *   - speakText(text, lang, rate, statusElId) 공용 함수로 분리 (카드·퀴즈 공용)

 *     재생 중(speaking)·대기 중(pending)일 때만 cancel() + 80ms 뒤 speak()
 */
var cachedVoices = [];
var lastVoiceError = '';
var speakTimer = null;
var speakToken = 0;
var MSG_NO_VOICE = '기기에 해당 언어 음성이 없음 (설정 > 손쉬운 사용 > 말하기 콘텐츠 > 음성에서 추가)';

// 고품질 성우 키워드 / 저음질(기계음) 키워드
var VOICE_GOOD_WORDS = ['enhanced', 'premium', 'siri', 'natural', 'neural', 'online', 'google'];
var VOICE_BAD_WORDS = ['compact', 'eloquence', 'espeak', 'pico'];
// 구형 로봇·효과음 성우 이름 (iOS·macOS는 이름에 'eloquence'를 넣지 않고 이 이름들로만 등록됨)
//  - Eloquence 계열: sandy, shelley, eddy, flo, grandma, grandpa, reed, rocko
//  - 특수·효과음·구형: albert, bad news, bahh, bells, boing, bubbles, cellos, good news,
//    jester, organ, superstar, trinoids, whisper, wobble, zarvox, fred, junior, ralph, kathy, karen
//  - 단어 단위로만 비교한다(예: 'organ'이 'Morgan'에, 'fred'가 'Freddy'에 걸리지 않도록).
var VOICE_ROBOT_NAMES = ['sandy', 'shelley', 'eddy', 'flo', 'grandma', 'grandpa', 'reed', 'rocko',
  'albert', 'bad news', 'bahh', 'bells', 'boing', 'bubbles', 'cellos', 'good news', 'jester', 'organ',
  'superstar', 'trinoids', 'whisper', 'wobble', 'zarvox', 'fred', 'junior', 'ralph', 'kathy', 'karen'];

function voiceNameTokens(name) {
  return String(name || '').toLowerCase().replace(/[^a-z]+/g, ' ').trim().split(' ').filter(Boolean);
}

function isRobotVoiceName(name) {
  var tokens = voiceNameTokens(name);
  if (!tokens.length) return false;
  var joined = ' ' + tokens.join(' ') + ' ';
  for (var i = 0; i < VOICE_ROBOT_NAMES.length; i++) {
    var key = VOICE_ROBOT_NAMES[i];
    if (key.indexOf(' ') !== -1) {
      if (joined.indexOf(' ' + key + ' ') !== -1) return true;   // 여러 단어 이름("bad news")은 구절 일치
    } else if (tokens.indexOf(key) !== -1) {
      return true;                                                // 한 단어 이름은 단어 경계 일치
    }
  }
  return false;
}
// 영국식 이름(영국 성우로 간주할 이름들)
var UK_VOICE_NAMES = ['daniel', 'oliver', 'arthur', 'kate', 'serena', 'martha', 'stephanie', 'libby', 'sonia', 'ryan', 'maisie', 'google uk english'];
// 브라우저·OS가 다른 태그로 보고하는 같은 언어(노르웨이어 복수 태그)
var LANG_ALIASES = { 'nb': ['no'], 'no': ['nb'] };

function voiceQualityScore(name) {
  var n = String(name || '').toLowerCase();
  var score = 0;
  if (isRobotVoiceName(n)) score -= 100;   // 구형 로봇·효과음 성우는 항상 일반 사람 목소리보다 후순위
  for (var i = 0; i < VOICE_GOOD_WORDS.length; i++) {
    if (n.indexOf(VOICE_GOOD_WORDS[i]) !== -1) score += 10;
  }
  for (var j = 0; j < VOICE_BAD_WORDS.length; j++) {
    if (n.indexOf(VOICE_BAD_WORDS[j]) !== -1) score -= 30;
  }
  return score;
}

function nameIsUk(name) {
  var n = String(name || '').toLowerCase();
  for (var i = 0; i < UK_VOICE_NAMES.length; i++) {
    if (n.indexOf(UK_VOICE_NAMES[i]) !== -1) return true;
  }
  return false;
}

function getAllVoices() {
  if (!('speechSynthesis' in window)) return [];
  var list = window.speechSynthesis.getVoices() || [];
  if (list.length) {
    cachedVoices = list;
    return list;
  }
  return cachedVoices || [];
}

function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  var list = window.speechSynthesis.getVoices() || [];
  if (list.length) cachedVoices = list;
  refreshVoiceStatus();
  refreshQuizVoiceStatus();
}

function initVoices() {
  if (!('speechSynthesis' in window)) return;
  loadVoices();
  // 목소리 목록이 늦게 도착하는 기기(iOS·Safari·웹뷰)를 위해 두 경로 모두 등록하고 한 번 더 확인
  window.speechSynthesis.onvoiceschanged = loadVoices;
  if (window.speechSynthesis.addEventListener) {
    window.speechSynthesis.addEventListener('voiceschanged', loadVoices);
  }
  setTimeout(loadVoices, 300);
  setTimeout(loadVoices, 1500);
}

function voiceStatusBase(lang) {
  if (!lang) return '';
  return 'TTS ' + lang.tts + (lang.ttsNote ? (' · ' + lang.ttsNote) : '');
}

// statusElId: 카드 학습은 'tts-voice-info', 퀴즈는 'quiz-tts-voice-info'
function setVoiceStatus(msg, langObj, statusElId) {
  var statusEl = document.getElementById(statusElId || 'tts-voice-info');
  if (!statusEl) return;
  var lang = langObj || DATA[curLangIdx];
  var note = (lang && lang.ttsNote) ? (' · ' + lang.ttsNote) : '';
  statusEl.textContent = msg + note;
}

function refreshVoiceStatus() {
  var lang = DATA[curLangIdx];
  if (!lang) return;
  var statusEl = document.getElementById('tts-voice-info');
  if (!statusEl) return;
  var base = voiceStatusBase(lang);
  if (!('speechSynthesis' in window)) {
    statusEl.textContent = base;
    return;
  }
  var info = getVoiceMatchInfo(lang.tts);
  if (info.totalVoices === 0) {
    // 목소리 목록을 아직 못 받은 상태 → 기본 표시만 유지
    statusEl.textContent = base;
    return;
  }
  if (info.voice) {
    statusEl.textContent = base;
    statusEl.setAttribute('title', '선택 음성: ' + info.voice.name + ' [' + info.voice.lang + ']');
  } else {
    statusEl.textContent = MSG_NO_VOICE + (lang.ttsNote ? (' · ' + lang.ttsNote) : '');
  }
}

// 퀴즈 카드의 음성 상태 표시 (퀴즈 카드가 아직 없으면 아무것도 하지 않음)
function refreshQuizVoiceStatus() {
  var statusEl = document.getElementById('quiz-tts-voice-info');
  if (!statusEl) return;
  var sel = document.getElementById('quiz-lang-select');
  var lang = DATA[sel ? Number(sel.value) : quizLangIdx];
  if (!lang) return;
  var base = voiceStatusBase(lang);
  if (!('speechSynthesis' in window)) {
    statusEl.textContent = base;
    return;
  }
  var info = getVoiceMatchInfo(lang.tts);
  if (info.totalVoices === 0) {
    statusEl.textContent = base;
    return;
  }
  if (info.voice) {
    statusEl.textContent = base;
    statusEl.setAttribute('title', '선택 음성: ' + info.voice.name + ' [' + info.voice.lang + ']');
  } else {
    statusEl.textContent = MSG_NO_VOICE + (lang.ttsNote ? (' · ' + lang.ttsNote) : '');
  }
}

function getVoiceMatchInfo(langCode) {
  var empty = { voice: null, matched: false, totalVoices: 0, sameLangList: [] };
  if (!('speechSynthesis' in window)) return empty;
  var voices = getAllVoices();
  if (!voices.length) return empty;

  var target = String(langCode || '').toLowerCase().replace(/_/g, '-');
  var prefix = target.split('-')[0];
  var aliasPrefixes = LANG_ALIASES[prefix] || [];

  var best = null;
  var bestScore = -100000;
  var sameLangList = [];

  for (var i = 0; i < voices.length; i++) {
    var v = voices[i];
    var vLang = String(v.lang || '').toLowerCase().replace(/_/g, '-');
    var vPrefix = vLang.split('-')[0];
    var vName = String(v.name || '').toLowerCase();

    var langScore = 0;
    if (vLang === target) {
      langScore = 100;                                              // 언어 태그 정확히 일치
    } else if (target === 'en-gb' && vPrefix === 'en' && nameIsUk(vName)) {
      langScore = 95;                                               // 영국식 이름의 영어 성우
    } else if (vPrefix === prefix || aliasPrefixes.indexOf(vPrefix) !== -1) {
      langScore = 40;                                               // 같은 언어의 다른 지역 변종
    }
    if (!langScore) continue;                                        // 다른 언어 음성은 쓰지 않음

    sameLangList.push(v);
    var score = langScore + voiceQualityScore(vName);                // 고품질 우선, compact·eloquence 후순위
    if (score > bestScore) {
      bestScore = score;
      best = v;
    }
  }

  return {
    voice: best,
    matched: Boolean(best),
    totalVoices: voices.length,
    sameLangList: sameLangList
  };
}

function pickBestVoice(langCode) {
  return getVoiceMatchInfo(langCode).voice;
}

function buildNaturalSpeechText(text, langId) {
  var t = String(text || '').trim();
  // 괄호 안 설명/화자 표기 정리 및 쉼표/마침표 호흡 자연화
  t = t.replace(/^\([^)]*\)\s*/, '');
  if (langId === '20' || langId === '22' || langId === '23') {
    // 스코츠 계열 축약/방언 철자를 발음 엔진이 자연스럽게 읽도록 보조
    t = t.replace(/\bA\b/g, 'I').replace(/\bme\b/g, 'my').replace(/\btae\b/g, 'to').replace(/\bwark\b/g, 'work').replace(/\bcaur\b/g, 'car');
  }
  return t;
}

// 언어별 기본 속도
function baseSpeechRate(lang) {
  var baseRate = 0.93;
  if (!lang) return baseRate;
  if (lang.id === '18' || lang.id === '19' || lang.id === '27') baseRate = 0.90;
  if (lang.id === '04' || lang.id === '05' || lang.id === '06' || lang.id === '07') baseRate = 0.95;
  return baseRate;
}

/* 공용 발음 재생 — 카드 학습(문장)과 퀴즈(문제 문장)가 함께 쓴다.
 * text: 읽을 원문 / lang: DATA의 언어 객체 / rate: 1.0이면 언어별 기본 속도, 0.7은 느리게
 * statusElId: 음성 상태를 표시할 요소 id
 */
function speakText(text, lang, rate, statusElId) {
  if (!('speechSynthesis' in window)) {
    alert('현재 뷰어에서는 음성 합성을 지원하지 않습니다. PC 브라우저나 모바일 웹 브라우저(Chrome·Safari 등)에서 열어주세요.');
    return;
  }
  if (!lang) return;
  var statusId = statusElId || 'tts-voice-info';
  var synth = window.speechSynthesis;

  lastVoiceError = '';
  if (speakTimer) {
    clearTimeout(speakTimer);
    speakTimer = null;
  }
  var myToken = ++speakToken;   // 연속 클릭 시 이전 예약 재생을 무효화

  var info = getVoiceMatchInfo(lang.tts);
  var rawText = buildNaturalSpeechText(text, lang.id);

  // 목소리 목록은 있는데 이 언어 성우가 없으면 엉뚱한 언어로 읽지 않고 안내만 표시
  // (라틴어·게일어·웨일스어처럼 기기에 음성이 없는 언어)
  if (info.totalVoices > 0 && !info.voice) {
    setVoiceStatus(MSG_NO_VOICE, lang, statusId);
    return;
  }

  var useRate = (typeof rate === 'number' && rate > 0) ? rate : 1.0;
  if (useRate === 1.0) useRate = baseSpeechRate(lang);

  function fire() {
    if (myToken !== speakToken) return;   // 그 사이 새 재생 요청이 들어왔으면 취소
    if (!('speechSynthesis' in window)) return;

    // 목록이 비어 있던 기기(iOS·웹뷰)는 이 시점에 목소리가 도착해 있을 수 있어 한 번 더 확인
    if (info.totalVoices === 0) {
      var lateInfo = getVoiceMatchInfo(lang.tts);
      if (lateInfo.totalVoices > 0) info = lateInfo;
      if (info.totalVoices > 0 && !info.voice) {
        setVoiceStatus(MSG_NO_VOICE, lang, statusId);
        return;
      }
    }

    var u = new SpeechSynthesisUtterance(rawText);
    u.lang = lang.tts;
    if (info.voice) u.voice = info.voice;
    u.rate = useRate;
    u.pitch = 1.0;

    u.onerror = function(ev) {
      var err = ev && ev.error ? String(ev.error) : '재생 오류';
      if (err === 'canceled' || err === 'interrupted') return;   // 새 재생·정지로 인한 정상 취소
      lastVoiceError = err;
      setVoiceStatus('TTS 오류(' + err + ')', lang, statusId);
    };

    if (info.totalVoices === 0) {
      // iOS·웹뷰: 목소리 목록이 비어 있어도 lang만 지정해 폴백 재생
      setVoiceStatus('목소리 목록 0개 — 기본 음성으로 시도', lang, statusId);
    } else {
      setVoiceStatus('음성: ' + info.voice.name + ' [' + info.voice.lang + '] (전체 ' + info.totalVoices + '개)', lang, statusId);
    }

    synth.speak(u);
  }

  if (synth.speaking || synth.pending) {
    // 재생 중·대기 중일 때만 정지하고 80ms 뒤 재생 (cancel 직후 첫 음절이 씹히는 기기 대응)
    synth.cancel();
    if (synth.paused) synth.resume();
    speakTimer = setTimeout(function() {
      speakTimer = null;
      fire();
    }, 80);
  } else {
    // 이미 멈춰 있으면 버튼 클릭 처리 안에서 곧바로 speak()
    // → iOS Safari 자동 재생 정책(사용자 제스처 없이 시작한 발화 차단)에 걸리지 않음
    fire();
  }
}

// 카드 학습: 현재 언어·현재 문장을 읽는다
function speakSentence(rate) {
  var lang = DATA[curLangIdx];
  if (!lang) return;
  var sent = lang.sents[Math.min(curSentIdx, lang.sents.length - 1)];
  speakText(sent.o, lang, rate, 'tts-voice-info');
}

var currentQuizCorrectIndex = 0;
var quizLangIdx = 29;      // 퀴즈에 선택된 언어(DATA 인덱스)
var quizSentIdx = 0;       // 현재 퀴즈 문제의 문장 번호
var quizCorrect = null;    // 현재 퀴즈 문제의 문장 객체

// 퀴즈 카드의 🔊 다시 듣기 / 🐢 느리게 버튼
function quizSpeak(rate) {
  if (!quizCorrect) return;
  var lang = DATA[quizLangIdx];
  if (!lang) return;
  speakText(quizCorrect.o, lang, rate, 'quiz-tts-voice-info');
}

function newQuiz() {
  var idx = Number(document.getElementById('quiz-lang-select').value);
  var lang = DATA[idx];
  if (!lang) return;
  var qIdx = Math.floor(Math.random() * lang.sents.length);
  var correct = lang.sents[qIdx];

  var pool = [];
  for (var i = 0; i < lang.sents.length; i++) {
    if (i !== qIdx) pool.push(lang.sents[i]);
  }
  pool.sort(function() { return Math.random() - 0.5; });
  var options = [correct, pool[0], pool[1], pool[2]].sort(function() { return Math.random() - 0.5; });

  var optsHtml = '';
  for (var j = 0; j < options.length; j++) {
    var isRight = (options[j] === correct) ? 'true' : 'false';
    optsHtml += '<button class="quiz-opt" onclick="checkQuiz(this, ' + isRight + ')">' + options[j].k + '</button>';
  }

  // 다시 듣기 버튼이 읽을 문장을 기억
  quizLangIdx = idx;
  quizSentIdx = qIdx;
  quizCorrect = correct;

  document.getElementById('quiz-body').innerHTML =
    '<div class="card-top"><span>' + lang.id + '. ' + lang.name + ' 뜻 맞추기</span>' +
      '<span>' + ORDINALS[qIdx] + ' 문장 · <span id="quiz-tts-voice-info">' + voiceStatusBase(lang) + '</span></span></div>' +
    '<div class="orig-text">' + correct.o + '</div>' +
    '<div style="color:var(--muted); margin-bottom:12px;">발음: ' + formatTags(correct.p) + '</div>' +
    '<div class="quiz-audio">' +
      '<button class="btn-primary" onclick="quizSpeak(1.0)">🔊 다시 듣기</button>' +
      '<button onclick="quizSpeak(0.7)">🐢 느리게</button>' +
    '</div>' +
    optsHtml;

  // 문제가 뜨자마자 해당 문장을 자동 1회 재생
  //  (탭 전환·언어 변경·새 문제 버튼 클릭 처리 안에서 바로 speak → iOS 자동 재생 정책 통과)
  quizSpeak(1.0);
}

function checkQuiz(btn, isCorrect) {
  var opts = document.querySelectorAll('.quiz-opt');
  for (var i = 0; i < opts.length; i++) {
    opts[i].disabled = true;
  }
  btn.classList.add(isCorrect ? 'correct' : 'wrong');
}

function setCmpSent(i) {
  cmpSentIdx = i;
  renderCompare();
}

function renderCompare() {
  var pills = '';
  for (var i = 0; i < 10; i++) {
    pills += '<button class="pill ' + (i === cmpSentIdx ? 'active' : '') + '" onclick="setCmpSent(' + i + ')">' + ORDINALS[i] + '</button>';
  }
  document.getElementById('cmp-pills').innerHTML = pills;

  var selectIds = ['cmp-1', 'cmp-2', 'cmp-3'];
  var gridHtml = '';
  for (var j = 0; j < selectIds.length; j++) {
    var lIdx = Number(document.getElementById(selectIds[j]).value);
    var lang = DATA[lIdx];
    var s = lang.sents[Math.min(cmpSentIdx, lang.sents.length - 1)];
    gridHtml +=
      '<div class="card">' +
        '<div class="card-top"><span>' + lang.id + '. ' + lang.name + '</span><span>' + lang.native + '</span></div>' +
        '<div style="font-size:1.15rem; font-weight:700; margin-bottom:10px;">' + s.o + '</div>' +
        '<div class="box"><div class="box-label">발음</div><div>' + formatTags(s.p) + '</div></div>' +
        '<div class="box"><div class="box-label">해석</div><div>' + s.k + '</div></div>' +
      '</div>';
  }
  document.getElementById('compare-grid').innerHTML = gridHtml;
}


function showVoiceDiag() {
  var lang = DATA[curLangIdx];
  var voices = ('speechSynthesis' in window) ? (window.speechSynthesis.getVoices() || cachedVoices || []) : [];
  var info = getVoiceMatchInfo(lang.tts);
  var sameSummary = info.sameLangList.slice(0, 5).map(function(v) {
    return v.name + ' (' + v.lang + ')';
  }).join(', ') || '없음';
  var allSample = voices.slice(0, 8).map(function(v) {
    return v.name + ' [' + v.lang + ']';
  }).join(' / ') || '목록 비어 있음';

  alert(
    '[음성 엔진 진단]\n' +
    '- 현재 언어: ' + lang.name + ' (' + lang.tts + ')\n' +
    '- 브라우저 speechSynthesis 지원: ' + (('speechSynthesis' in window) ? '예' : '아니오') + '\n' +
    '- 기기 전체 설치 목소리 수: ' + voices.length + '개\n' +
    '- 선택된 목소리: ' + (info.voice ? (info.voice.name + ' [' + info.voice.lang + ']') : '없음(이 언어 음성 미설치 — 재생하지 않음)') + '\n' +
    '- 일치 언어군 목소리: ' + sameSummary + '\n' +
    '- 기기 목소리 샘플: ' + allSample + '\n' +
    (lastVoiceError ? ('- 최근 오류: ' + lastVoiceError + '\n') : '') +
    '\n※ 목소리 수가 0개이거나 해당 언어 목소리가 없다면, 기기 설정(언어/음성 합성)이나 외부 브라우저(Chrome/Safari)를 확인해 보세요.'
  );
}

initSelects();
renderCard();
initVoices();
</script>
